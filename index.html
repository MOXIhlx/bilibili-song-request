<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨墨弹幕点歌机</title>
    <script>
      // Tauri 2 的 WebView 里没有内嵌 axum 的端口信息时，回退到默认端口。
      // 内嵌服务器端口可通过 config.json 的 server.port 修改，
      // Tauri 启动时会注入 window.__BSR_SERVER__（见 src-tauri/src/main.rs）。
      window.__BSR_SERVER__ = window.__BSR_SERVER__ || {
        host: '127.0.0.1',
        port: 17777,
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
